name: SideEditor CI

# Builds the SideEditor-branded SideStore app and publishes a verified,
# downloadable SideEditor.ipa as a workflow artifact.
#
# The app identity comes from the project itself:
#   Build.xcconfig       PRODUCT_NAME                = SideStore   -> CFBundleName / CFBundleExecutable
#   Build.xcconfig       BASE_BUNDLE_ID             = com.SideStore.SideStore (Release)
#   AltStore/Info.plist  CFBundleDisplayName        = SideEditor
#
# There is exactly one application target ("SideStore") in AltStore.xcodeproj
# and its display name is SideEditor; there is no "SideEditor" scheme, so the
# build goes through the project's own Makefile pipeline (scripts/ci/workflow.py).

on:
  workflow_dispatch:
  push:
    branches: [sideeditor]

permissions:
  contents: read

concurrency:
  group: sideeditor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SideEditor IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Report build environment
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: Install ldid and xcbeautify
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Validate project file
        run: python3 scripts/ci/pbxproj_lint.py AltStore.xcodeproj/project.pbxproj

      - name: List schemes and targets
        run: xcodebuild -list -project AltStore.xcodeproj

      - name: Build, fake-sign, and package
        run: |
          set -o pipefail
          python3 scripts/ci/workflow.py build 2>&1 | tee build-console.log

      - name: Rename product to SideEditor.ipa
        run: |
          ls -la SideStore.ipa
          mv SideStore.ipa SideEditor.ipa
          ls -la SideEditor.ipa

      - name: Verify SideEditor IPA contents and identity
        run: |
          python3 - <<'PY'
          import plistlib, sys, zipfile

          ipa = "SideEditor.ipa"
          with zipfile.ZipFile(ipa) as z:
              names = z.namelist()
              apps = [n for n in names if n.endswith(".app/Info.plist") and n.count("/") == 2]
              if len(apps) != 1:
                  sys.exit(f"expected exactly one Payload/*.app, found {apps}")
              app_dir = apps[0][: -len("Info.plist")]
              info = plistlib.loads(z.read(apps[0]))

          expected = {
              "CFBundleDisplayName": "SideEditor",
              "CFBundleIdentifier": "com.SideStore.SideStore",
              "CFBundleName": "SideStore",
              "CFBundleExecutable": "SideStore",
          }
          actual = {k: info.get(k) for k in expected}
          print(f"app dir        : {app_dir}")
          print(f"identity       : {actual}")

          problems = [f"{k}: expected {v!r}, got {actual[k]!r}" for k, v in expected.items() if actual[k] != v]

          executable = f"{app_dir}{info.get('CFBundleExecutable')}"
          with zipfile.ZipFile(ipa) as z:
              if executable not in z.namelist():
                  problems.append(f"missing main executable {executable}")

              # A plugin bundle name is the first path component under PlugIns/.
              plugins_prefix = app_dir + "PlugIns/"
              appexes = sorted({
                  n[len(plugins_prefix):].split("/")[0]
                  for n in names
                  if n.startswith(plugins_prefix) and len(n) > len(plugins_prefix)
              })
              print(f"embedded plugins: {appexes or '(none)'}")
              if "AltWidgetExtension.appex" not in appexes:
                  problems.append("AltWidgetExtension.appex is not embedded")

          if problems:
              for p in problems:
                  print(f"FAIL {p}")
              sys.exit(1)
          print("identity: ok")
          PY

      - name: Upload SideEditor IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideEditor-ipa
          path: SideEditor.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs
        if: hashFiles('SideStore.dSYMs.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SideEditor-dSYMs
          path: SideStore.dSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideEditor-build-log
          path: |
            build-console.log
            build/logs/*.log
          if-no-files-found: warn
          retention-days: 14
